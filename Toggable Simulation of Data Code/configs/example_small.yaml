# Small mixed run: finishes in about a minute on a laptop CPU.
#   python -m fptsim run --config configs/example_small.yaml --dry-run
#   python -m fptsim run --config configs/example_small.yaml
run_name: example_small
output_dir: results/example_small
master_seed: 12345
num_graphs: 40
device: auto              # auto | cpu | cuda | cuda:N
backend: auto             # auto | torch | numpy
max_batch_walks: 20_000_000
shard_size: 20
graphs_per_batch: 20
log_interval_s: 10
plot_sample: 3

toggles:
  compute_exact: true
  run_monte_carlo: true
  save_counts: true
  save_r_tensors: true
  save_ci: false
  convergence_checkpoints: true
  make_plots: true
  resume: true

graphs:
  families:
    grid:             {weight: 0.3, rows: [2, 4], cols: [2, 4]}
    grid_holes:       {weight: 0.1, rows: [3, 5], cols: [3, 5], hole_frac: [0.0, 0.25]}
    erdos_renyi:      {weight: 0.2, n: [6, 16], p: [0.2, 0.5]}
    random_tree:      {weight: 0.2, n: [5, 14]}
    cycle:            {weight: 0.1, n: [4, 12]}
    random_geometric: {weight: 0.1, n: [6, 16], radius: [0.35, 0.6]}
  weights: {dist: uniform, low: 0.2, high: 1.0}
  mu: {mode: deg, on_violation: fix}
  B: {mode: random_k, k: [2, 4]}
  q: {mode: sparse, fraction: 0.2, low: 0.0, high: 0.5}
  dt: auto

simulation:
  T: 17
  T_mode: steps
  N: 10_000
  replicates: 2
  N_checkpoints: [100, 1000, 10000]
  chunk_walks: 10_000
