# Large unattended GPU run. Check the estimate first:
#   python -m fptsim run --config configs/server_large.yaml --dry-run
# then use scripts/run_server.sh (nohup) or scripts/slurm_array.sbatch (array jobs, --shard i/k).
run_name: random_mix_v1
output_dir: results/random_mix_v1
master_seed: 12345
num_graphs: 5000
device: auto
backend: auto
devices: [0]              # e.g. [0, 1, 2, 3] to split shards across four GPUs
max_batch_walks: 50_000_000
shard_size: 500
graphs_per_batch: 64
log_interval_s: 60
plot_sample: 10

toggles:
  compute_exact: true
  run_monte_carlo: true
  save_counts: true
  save_r_tensors: true
  save_ci: false
  convergence_checkpoints: true
  make_plots: false
  resume: true

graphs:
  families:
    grid:             {weight: 0.3, rows: [2, 6], cols: [2, 6]}
    grid_holes:       {weight: 0.1, rows: [3, 7], cols: [3, 7], hole_frac: [0.0, 0.25]}
    erdos_renyi:      {weight: 0.2, n: [8, 40], p: [0.1, 0.4]}
    random_geometric: {weight: 0.2, n: [8, 40], radius: [0.25, 0.5]}
    random_tree:      {weight: 0.1, n: [6, 30]}
    watts_strogatz:   {weight: 0.1, n: [10, 40], k: [2, 4], beta: [0.0, 0.5]}
  weights: {dist: uniform, low: 0.2, high: 1.0}
  mu: {mode: deg, on_violation: fix}
  B: {mode: random_k, k: [2, 5]}
  q: {mode: sparse, fraction: 0.2, low: 0.0, high: 0.5}
  dt: auto
  max_retries: 200

simulation:
  T: 17
  T_mode: steps
  N: 1_000_000
  replicates: 3
  N_checkpoints: [100, 1000, 10000, 100000, 1000000]
  chunk_walks: 250_000

sweep:
  q_scale: [0.0, 0.5, 1.0]
