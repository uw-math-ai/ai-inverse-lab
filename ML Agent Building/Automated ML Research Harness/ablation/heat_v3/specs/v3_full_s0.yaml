name: heat_v3_full_s0
pipeline: v3
problem: Given noisy temperature measurements at four sensor locations over time,
  recover the four unknown piecewise-constant thermal conductivities of a 1-D rod
  governed by the heat equation.
simulator:
  name: python
  params:
    path: examples/heat_diffusion_simulator.py
    function: simulate
    n_segments: 4
    noise: 0.001
data:
  n_train: 3000
  n_val: 750
  n_test: 750
  seed: 5
metrics:
  primary: rel_l2
  secondary:
  - r2
  - rmse
success:
  threshold: 0.05
budget:
  compute_seconds: 760
  experiment_timeout: 120
  wall_seconds: 7200
hardware:
  workers: 6
  gpus: auto
  remote:
    enabled: true
    host: doppio
    use_for: all
    python: /home/kushalk3/.mlharness_venv/bin/python
    max_failures: 3
constraints:
  allowed_methods: all
  forbidden_methods: []
  allow_custom_code: true
  allow_forward_model: true
  max_forward_evals: 3000000
  notes:
  - Models may only be trained on simulated data; the test split is never used for
    selection
research:
  researchers:
  - mathematical
  - ml
  - experimental
  - exploratory
  llm_calls: 72
literature:
  enabled: true
  max_total_queries: 32
  n_results: 4
memory:
  enabled: true
  mode: cumulative
execution:
  ensemble: true
  bootstrap: 200
evaluation:
  shift_n: 300
  shift_sets:
  - name: noise_x3
    params:
      noise: 0.003
  - name: k_low_0.3
    params:
      k_low: 0.3
  strict_holdout: false
  exposure_registry: ablation/heat_v3/exposure_registry.sqlite
program:
  max_actions: 24
  max_agents: 10
  max_active_agents: 6
  max_depth: 2
  max_children: 4
  max_specialist_tasks: 8
  max_agent_turns: 8
  max_studies: 6
  budget_mode: soft
  confirmation_fraction: 0.25
  confirmation_seconds: 360
  auto_followup: true
  roles:
    orchestrator:
      backend: claude_code
      model: claude-fable-5-1
      effort: medium
      timeout: 900
    researcher:
      backend: claude_code
      model: claude-opus-5-5
      effort: medium
      timeout: 900
    critic:
      backend: claude_code
      model: claude-opus-5-5
      effort: medium
      timeout: 900
    specialist:
      backend: claude_code
      model: claude-sonnet-5-5
      effort: medium
      timeout: 600
    orchestrator_escalated:
      backend: claude_code
      model: claude-fable-5-1
      effort: high
      timeout: 900
    researcher_escalated:
      backend: claude_code
      model: claude-fable-5-1
      effort: high
      timeout: 900
    critic_escalated:
      backend: claude_code
      model: claude-fable-5-1
      effort: high
      timeout: 900
llm:
  backend: claude_code
  model: claude-opus-5-5
  effort: medium
  timeout: 900
seed: 0
