name: heat_v3_smoke_s0
pipeline: v3
problem: Given noisy temperature measurements at four sensor locations over time,
  recover the four unknown piecewise-constant thermal conductivities of a 1-D rod
  governed by the heat equation.
simulator:
  name: python
  params:
    path: examples/heat_diffusion_simulator.py
    function: simulate
    n_segments: 2
    noise: 0.001
    n_grid: 20
    n_steps: 60
    sensors:
    - 3
    - 8
    - 12
    - 17
    every: 6
data:
  n_train: 240
  n_val: 80
  n_test: 80
  seed: 1302
metrics:
  primary: rel_l2
  secondary:
  - r2
  - rmse
success:
  threshold: 0.05
budget:
  compute_seconds: 120
  experiment_timeout: 30
  wall_seconds: 2400
hardware:
  workers: 2
  gpus: auto
constraints:
  allowed_methods: all
  forbidden_methods: []
  allow_custom_code: true
  allow_forward_model: true
  max_forward_evals: 3000000
  notes:
  - Models may only be trained on simulated data; the test split is never used for
    selection
research:
  researchers:
  - ml
  - mathematical
  llm_calls: 16
literature:
  enabled: false
  max_total_queries: 32
  n_results: 4
memory:
  enabled: true
  mode: cumulative
execution:
  ensemble: true
  bootstrap: 200
evaluation:
  shift_n: 300
  shift_sets: []
  strict_holdout: false
  exposure_registry: ablation/heat_v3/smoke_exposure.sqlite
program:
  max_actions: 6
  max_agents: 10
  max_active_agents: 6
  max_depth: 2
  max_children: 4
  max_specialist_tasks: 2
  max_agent_turns: 6
  max_studies: 3
  budget_mode: soft
  confirmation_fraction: 0.25
  auto_followup: true
  roles:
    orchestrator:
      backend: claude_code
      model: claude-fable-5-1
      effort: medium
      timeout: 900
    researcher:
      backend: claude_code
      model: claude-opus-5-5
      effort: medium
      timeout: 900
    critic:
      backend: claude_code
      model: claude-opus-5-5
      effort: medium
      timeout: 900
    specialist:
      backend: claude_code
      model: claude-sonnet-5-5
      effort: medium
      timeout: 900
    orchestrator_escalated:
      backend: claude_code
      model: claude-fable-5-1
      effort: high
      timeout: 900
    researcher_escalated:
      backend: claude_code
      model: claude-fable-5-1
      effort: high
      timeout: 900
    critic_escalated:
      backend: claude_code
      model: claude-fable-5-1
      effort: high
      timeout: 900
llm:
  backend: claude_code
  model: claude-opus-5-5
  effort: medium
  timeout: 900
seed: 0
