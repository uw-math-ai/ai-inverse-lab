# V2 research-first run on the 1-D heat-equation conductivity inverse problem.
#   python -m mlharness research --spec specs/heat_v2.yaml                 # LLM researchers (auto backend)
#   python -m mlharness research --spec specs/heat_v2.yaml --backend none  # offline heuristic researchers
# Same data, budget and evaluation protocol as the V1 heat ablation (data seed 5, 3000/750/750).
name: heat_v2
pipeline: v2
problem: >
  Given noisy temperature measurements at four sensor locations over time, recover the four unknown
  piecewise-constant thermal conductivities of a 1-D rod governed by the heat equation.
simulator:
  name: python
  params: {path: examples/heat_diffusion_simulator.py, function: simulate, n_segments: 4, noise: 0.001}
data: {n_train: 3000, n_val: 750, n_test: 750, seed: 5}
metrics: {primary: rel_l2, secondary: [r2, rmse]}
success: {threshold: 0.05}
budget: {compute_seconds: 400, experiment_timeout: 120}
hardware: {workers: 6, gpus: auto}
constraints:
  allowed_methods: all
  allow_custom_code: true
  allow_forward_model: true        # methods may call the simulator's forward operator (budgeted)
  max_forward_evals: 3000000
  notes: ["Models may only be trained on simulated data; the test split is never used for selection"]
research:
  researchers: [mathematical, ml, experimental, exploratory]
  max_rounds: 3
  min_rounds: 2
  proposals_per_researcher: 2
  quality_threshold: 0.75
  llm_calls: 30
  pilot_tests: true
literature: {enabled: true, max_total_queries: 32, n_results: 4}
memory: {enabled: true}            # default path: .research_memory/memory.jsonl (shared across runs)
execution: {portfolio_size: 6, include_baselines: true, refine_rounds: 1, ensemble: true}
evaluation:
  shift_n: 300
  shift_sets:
    - {name: noise_x3, params: {noise: 0.003}}      # 3x sensor noise
    - {name: k_low_0.3, params: {k_low: 0.3}}       # conductivities partly outside the training prior
llm: {backend: auto, effort: medium}
